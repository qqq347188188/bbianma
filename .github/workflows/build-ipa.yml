name: Build IPA (TrollStore)

# 纯原生 Swift (SwiftUI) 工程，由 xcodegen 生成 Xcode 工程后编译。
# 使用系统 codesign 做 ad-hoc 签名，无需任何 Apple 证书，适合 TrollStore 安装。
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择完整 Xcode（含 iOS SDK）
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer 2>/dev/null || true

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（关闭签名）
        run: |
          xcodebuild -project CodecApp.xcodeproj -scheme CodecApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/CodecApp.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ARCHS="arm64" \
            archive

      - name: ad-hoc 签名并打包 IPA
        run: |
          APP="$RUNNER_TEMP/CodecApp.xcarchive/Products/Applications/CodecApp.app"
          # TrollStore 会用自带机制重新签名，这里只做系统 ad-hoc 签名即可，不需要 entitlements
          codesign --force --deep --sign - "$APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r codec-tool.ipa Payload
          rm -rf Payload

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: codec-tool-ipa
          path: codec-tool.ipa
